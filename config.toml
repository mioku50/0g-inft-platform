[training]
learning_rate = 5e-5
num_epochs = 3
batch_size = 8
warmup_steps = 500
weight_decay = 0.01

[dataset]
train_split = 0.8
validation_split = 0.2
max_length = 512

[model]
name = "distilbert-base-uncased"
num_labels = 2

[output]
checkpoint_steps = 1000
logging_steps = 100
evaluation_strategy = "steps"